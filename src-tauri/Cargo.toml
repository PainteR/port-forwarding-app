[package]
name = "port-forward"
version = "0.1.0"
description = "Native SSH tunnel manager for local, remote, dynamic, and Docker port forwards."
authors = ["painter"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "port_forwarding_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-mcp-bridge = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ssh2 = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
flate2 = "1"
tar = { version = "0.4.46", default-features = false }

[target.'cfg(windows)'.dependencies]
# WinCNG lacks Ed25519/Curve25519 support. Use the same crypto backend as
# macOS/Linux and link it statically so the installer needs no OpenSSL DLLs.
# Both features are required by libssh2-sys 0.3.x on Windows.
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
